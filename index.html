<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama de Acupuntura</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <svg id="acupuncture-diagram" viewBox="0 0 500 400">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="6" markerHeight="6"
                    orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
                </marker>
            </defs>

            <!-- Edges -->
            <!-- Thin Black Edges (Pentagram shape) -->
            <path class="edge edge-thin" d="M 250 60 L 175 330" data-nodes="5-red,5-blue" marker-end="url(#arrow)"></path>
            <path class="edge edge-thin" d="M 250 60 L 325 330" data-nodes="5-red,1-lightred" marker-end="url(#arrow)"></path>
            <path class="edge edge-thin" d="M 100 160 L 325 330" data-nodes="3-green,1-lightred" marker-end="url(#arrow)"></path>
            <path class="edge edge-thin" d="M 100 160 L 400 160" data-nodes="3-green,11-yellow" marker-end="url(#arrow)"></path>
            <path class="edge edge-thin" d="M 400 160 L 175 330" data-nodes="11-yellow,5-blue" marker-end="url(#arrow)"></path>

            <!-- Thick Red Edges (Pentagon shape) -->
            <path class="edge edge-thick edge-orange" d="M 250 60 L 100 160" data-nodes="5-red,3-green"></path>
            <path class="edge edge-thick" d="M 100 160 L 175 330" data-nodes="3-green,5-blue"></path>
            <path class="edge edge-thick" d="M 175 330 L 325 330" data-nodes="5-blue,1-lightred"></path>
            <path class="edge edge-thick" d="M 325 330 L 400 160" data-nodes="1-lightred,11-yellow"></path>
            <path class="edge edge-thick edge-orange" d="M 400 160 L 250 60" data-nodes="11-yellow,5-red"></path>

            <!-- Central Bar -->
            <g class="central-bar">
                <text x="265" y="142">I.D</text>
                <rect x="245" y="130" width="10" height="15" class="rect-id"/>
                <text x="265" y="162">S.J</text>
                <rect x="245" y="150" width="10" height="15" class="rect-sj"/>
                <text x="265" y="182">C</text>
                <rect x="245" y="170" width="10" height="15" class="rect-c"/>
                <text x="265" y="207">V.B</text>
                <rect x="245" y="195" width="10" height="15" class="rect-vb"/>
                <text x="265" y="227">H</text>
                <rect x="245" y="215" width="10" height="15" class="rect-h"/>
                <text x="265" y="247">B</text>
                <rect x="245" y="235" width="10" height="15" class="rect-b"/>
                <text x="265" y="267">E</text>
                <rect x="245" y="255" width="10" height="15" class="rect-e"/>
                <text x="265" y="292">R</text>
                <rect x="245" y="280" width="10" height="15" class="rect-r"/>
                <text x="265" y="312">I.G</text>
                <rect x="245" y="300" width="10" height="15" class="rect-ig"/>
                <text x="265" y="332">P</text>
                <rect x="245" y="320" width="10" height="15" class="rect-p"/>
            </g>

            <!-- Nodes -->
            <g class="node" data-node-id="5-red">
                <circle cx="250" cy="60" r="40" class="node-circle-outer"></circle>
                <circle cx="250" cy="60" r="35" class="node-circle-inner"></circle>
                <text x="250" y="70" class="node-text">5</text>
            </g>
            <g class="node" data-node-id="3-green">
                <circle cx="100" cy="160" r="35" class="node-circle-outer"></circle>
                <circle cx="100" cy="160" r="30" class="node-circle-inner"></circle>
                <text x="100" y="165" class="node-text">3</text>
            </g>
            <g class="node" data-node-id="11-yellow">
                <circle cx="400" cy="160" r="40" class="node-circle-outer"></circle>
                <circle cx="400" cy="160" r="35" class="node-circle-inner"></circle>
                <text x="400" y="170" class="node-text">11</text>
            </g>
            <g class="node" data-node-id="5-blue">
                <circle cx="175" cy="330" r="35" class="node-circle-outer"></circle>
                <circle cx="175" cy="330" r="30" class="node-circle-inner"></circle>
                <text x="175" y="335" class="node-text">5</text>
            </g>
            <g class="node" data-node-id="1-lightred">
                <circle cx="325" cy="330" r="35" class="node-circle-outer"></circle>
                <circle cx="325" cy="330" r="30" class="node-circle-inner"></circle>
                <text x="325" y="335" class="node-text">1</text>
            </g>
        </svg>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
