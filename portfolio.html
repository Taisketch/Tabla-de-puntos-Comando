<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Portafolio - Mi Portafolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="about.html">Sobre mí</a></li>
                <li><a href="services.html">Servicios</a></li>
                <li><a href="portfolio.html">Portafolio</a></li>
                <li><a href="contact.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Mi Portafolio</h1>

        <section id="upload-section">
            <h2>Subir nuevo trabajo</h2>
            <form id="upload-form">
                <label for="work-title">Título del trabajo:</label>
                <input type="text" id="work-title" required>
                <label for="work-image">Seleccionar imagen:</label>
                <input type="file" id="work-image" accept="image/*" required>
                <button type="submit">Subir trabajo</button>
            </form>
        </section>

        <section id="portfolio-gallery">
            <h2>Mis Trabajos</h2>
            <!-- Los trabajos subidos se mostrarán aquí -->
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Mi Portafolio</p>
    </footer>

    <script src="js/script.js"></script>
</body>
