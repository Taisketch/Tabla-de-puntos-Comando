    <!-- Estilos CSS personalizados --><style>
        /* Estilos para las líneas diagonales (eliminados de los círculos, pero se mantiene la definición por si acaso) */
        .diag-line {
            position: absolute;
            z-index: 5;
            transform-origin: center;
        }
        .diag-green {
            width: 150px;
            height: 12px;
            background-color: #34a853;
            transform: rotate(-45deg);
            left: -20px;
            top: 70px;
            border-radius: 6px;
        }
        .diag-orange {
            width: 150px;
            height: 12px;
            background-color: #fbbc05;
            transform: rotate(45deg);
            right: -20px;
            top: 70px;
            border-radius: 6px;
        }
         .diag-blue {
            width: 150px;
            height: 12px;
            background-color: #4285f4;
            transform: rotate(45deg);
            left: -20px;
            top: 70px;
            border-radius: 6px;
        }
        .diag-gray {
            width: 150px;
            height: 12px;
            background-color: #bdc1c6;
            transform: rotate(-45deg);
            right: -20px;
            top: 70px;
            border-radius: 6px;
        }

        /* Estilos para el gráfico SVG interno */
        .graph-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .graph-node circle {
            stroke-width: 2;
            transition: all 0.2s ease-in-out;
        }
        .graph-node text {
            font-family: Arial, sans-serif;
            font-size: 10px;
            font-weight: bold;
            fill: black;
            pointer-events: none;
        }
        .graph-node:hover circle {
            transform: scale(1.1);
            filter: brightness(1.1);
        }
        .graph-edge {
            stroke: #333;
            stroke-width: 1.5;
            fill: none;
        }
    </style>

    <!-- Script de interactividad (opcional) --><script>
        document.querySelectorAll('.graph-svg').forEach(svg => {
            const nodes = svg.querySelectorAll('.graph-node');
            const edges = svg.querySelectorAll('.graph-edge');
            let clickedNode = null;

            nodes.forEach(node => {
                node.addEventListener('click', () => {
                    const nodeId = node.dataset.nodeId;

                    // If the same node is clicked, deselect it
                    if (clickedNode === node) {
                        resetSelection();
                        clickedNode = null;
                        return;
                    }

                    // Reset previous selection
                    resetSelection();

                    // Highlight the clicked node
                    node.classList.add('clicked');
                    const circle = node.querySelector('circle');
                    circle.style.transform = 'scale(1.2)';
                    circle.style.filter = 'brightness(1.2)';
                    clickedNode = node;

                    // Highlight connected edges
                    edges.forEach(edge => {
                        const connectedNodes = edge.dataset.nodes.split(',');
                        if (connectedNodes.includes(nodeId)) {
                            edge.style.stroke = '#FFD700'; // Gold color for highlight
                            edge.style.strokeWidth = '3';
                        }
                    });
                });
            });

            function resetSelection() {
                nodes.forEach(n => {
                    n.classList.remove('clicked');
                    const circle = n.querySelector('circle');
                    circle.style.transform = '';
                    circle.style.filter = '';
                });
                edges.forEach(e => {
                    e.style.stroke = '';
                    e.style.strokeWidth = '';
                });
            }
        });
    </script>
